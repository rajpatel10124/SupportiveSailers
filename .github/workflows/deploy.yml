name: Deploy SupportiveSailers

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/SupportiveSailers || git clone https://github.com/rajpatel10124/SupportiveSailers.git

            cd ~/SupportiveSailers

            git pull origin main

            docker stop supportivesailers-container || true
            docker rm supportivesailers-container || true

            docker build -t supportivesailers .

            docker run -d \
              --name supportivesailers-container \
              -p ${{ secrets.APP_PORT }}:80 \
              supportivesailers
